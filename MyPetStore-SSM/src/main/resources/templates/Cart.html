<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>购物车 - MyPetStore</title>
    <link rel="stylesheet" th:href="@{/css/storefront.css}">
    <script defer th:src="@{/js/motion.js}"></script>
</head>
<body>
<header th:replace="~{fragments/shell :: header('cart')}"></header>
<main class="store-shell page">
    <header class="page-head"><span class="eyebrow">YOUR CART</span><h1>购物车</h1><p>确认商品与数量，准备好后即可进入结算。</p></header>
    <div class="flash-message" role="status" th:if="${message}" th:text="${message}"></div>
    <div class="flash-message is-error" role="alert" th:if="${error}" th:text="${error}"></div>
    <section class="table-card cart-table-card" th:if="${!lines.isEmpty()}">
        <table class="table cart-table">
            <thead><tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th><th>操作</th></tr></thead>
            <tbody>
            <tr th:each="line:${lines}" th:id="|item-${line.id}|" th:classappend="${!line.available()}?' is-unavailable'">
                <td class="cart-table__product"><div class="cart-product"><img th:src="|/${line.coverImage}|" th:alt="${line.name}"><span><strong th:text="${line.name}"></strong><small th:text="${line.sku}"></small><em class="stock out" th:if="${!line.available()}" th:text="${line.status!='ON_SALE'?'商品已下架':'库存不足'}"></em></span></div></td>
                <td data-label="单价" th:text="|¥${#numbers.formatDecimal(line.price,1,2)}|"></td>
                <td data-label="数量"><form class="actions cart-quantity-form" method="post" th:action="@{/cart/items/{id}(id=${line.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="version" th:value="${line.version}"><div class="inline-qty"><button type="button" data-qty-step="-1" aria-label="减少数量">−</button><input class="control qty" type="number" name="quantity" min="1" max="99" th:value="${line.quantity}"><button type="button" data-qty-step="1" aria-label="增加数量">＋</button></div><button class="secondary">更新</button></form></td>
                <td data-label="小计" class="cart-line-total" th:text="|¥${#numbers.formatDecimal(line.subtotal(),1,2)}|"></td>
                <td data-label="操作"><form method="post" th:action="@{/cart/items/{id}/remove(id=${line.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="version" th:value="${line.version}"><button class="danger">移除</button></form></td>
            </tr>
            </tbody>
        </table>
        <div class="cart-summary"><strong th:text="|应付总额 ¥${#numbers.formatDecimal(total,1,2)}|">总额</strong><a class="primary" th:href="@{/checkout}" th:if="${#lists.size(lines)>0 and #lists.size(lines.?[available()])==#lists.size(lines)}">去结算</a><span class="stock out" th:unless="${#lists.size(lines)>0 and #lists.size(lines.?[available()])==#lists.size(lines)}">请先移除或调整失效商品</span></div>
    </section>
    <div class="empty panel" th:if="${lines.isEmpty()}"><h2>购物车还是空的</h2><p>去挑选喜欢的宠物或用品吧。</p><a class="primary" th:href="@{/category}">去选购</a></div>
</main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
</body>
</html>
