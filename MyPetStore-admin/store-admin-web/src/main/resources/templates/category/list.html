<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>分类管理 - MyPetStore</title>
    <style>
        :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { margin: 0; background: #f5f7fa; color: #1f2937; }
        main { width: min(1120px, calc(100% - 40px)); margin: 40px auto; }
        header, .actions, footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        h1 { margin: 0; font-size: 28px; }
        a { color: #2563eb; text-decoration: none; }
        .button { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 8px; background: #2563eb; color: white; }
        .panel { margin-top: 24px; overflow: hidden; background: white; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 8px 24px rgb(15 23 42 / 6%); }
        .message, .error { margin: 18px; padding: 12px 14px; border-radius: 8px; }
        .message { color: #166534; background: #dcfce7; }
        .error { color: #991b1b; background: #fee2e2; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; border-bottom: 1px solid #eef0f3; text-align: left; }
        th { background: #fafafa; color: #4b5563; font-size: 14px; }
        .child td:first-child { padding-left: 38px; }
        .level { display: inline-block; min-width: 54px; padding: 3px 8px; border-radius: 999px; background: #e5e7eb; font-size: 12px; text-align: center; }
        .child .level { color: #1d4ed8; background: #dbeafe; }
        .row-actions { display: flex; align-items: center; gap: 12px; }
        .row-actions form { margin: 0; }
        button.link { padding: 0; border: 0; background: transparent; color: #b91c1c; font: inherit; cursor: pointer; }
        .empty { padding: 48px 16px; text-align: center; color: #6b7280; }
        footer { padding: 18px; }
        .pagination { display: flex; gap: 14px; }
        .disabled { color: #9ca3af; }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>分类管理</h1>
            <p>维护商品使用的两级分类，编码和父子关系创建后不可修改。</p>
        </div>
        <div class="actions">
            <a th:href="@{/}">返回首页</a>
            <a class="button" th:href="@{/admin/categories/new}">新增一级分类</a>
        </div>
    </header>

    <section class="panel">
        <p class="message" th:if="${message}" th:text="${message}">操作成功</p>
        <p class="error" th:if="${error}" th:text="${error}">操作失败</p>
        <table>
            <thead>
            <tr>
                <th>层级</th>
                <th>编码</th>
                <th>名称</th>
                <th>父分类</th>
                <th>排序</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody th:each="top : ${page.records}">
            <tr>
                <td><span class="level">一级</span></td>
                <td th:text="${top.code}">DOGS</td>
                <td th:text="${top.name}">犬类</td>
                <td>—</td>
                <td th:text="${top.sortOrder}">10</td>
                <td class="row-actions">
                    <a th:href="@{/admin/categories/new(parentId=${top.id})}">新增子分类</a>
                    <a th:href="@{/admin/categories/{id}/edit(id=${top.id})}">编辑</a>
                    <form method="post" th:action="@{/admin/categories/{id}/delete(id=${top.id})}"
                          onsubmit="return confirm('确定删除这个分类吗？');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="link" type="submit">删除</button>
                    </form>
                </td>
            </tr>
            <tr class="child" th:each="child : ${top.children}">
                <td><span class="level">二级</span></td>
                <td th:text="${child.code}">DOGS_PETS</td>
                <td th:text="${child.name}">宠物</td>
                <td th:text="${top.name}">犬类</td>
                <td th:text="${child.sortOrder}">10</td>
                <td class="row-actions">
                    <a th:href="@{/admin/categories/{id}/edit(id=${child.id})}">编辑</a>
                    <form method="post" th:action="@{/admin/categories/{id}/delete(id=${child.id})}"
                          onsubmit="return confirm('确定删除这个分类吗？');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="link" type="submit">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
            <tbody th:if="${page.records.isEmpty()}">
            <tr>
                <td class="empty" colspan="6">
                    <p>暂无分类，可先新增一级分类</p>
                    <p th:if="${page.pages > 0 and page.current > page.pages}">
                        当前页已超出有效范围，
                        <a th:href="@{/admin/categories(page=1)}">返回第一页</a>
                        或 <a th:href="@{/admin/categories(page=${page.pages})}">前往最后一页</a>。
                    </p>
                </td>
            </tr>
            </tbody>
        </table>
        <footer>
            <span>共 <strong th:text="${page.total}">0</strong> 个一级分类</span>
            <nav class="pagination" aria-label="分类列表分页">
                <a th:if="${page.current > 1}" th:href="@{/admin/categories(page=${page.current - 1})}">上一页</a>
                <span class="disabled" th:unless="${page.current > 1}">上一页</span>
                <span>第 <strong th:text="${page.current}">1</strong> / <strong th:text="${page.pages == 0 ? 1 : page.pages}">1</strong> 页</span>
                <a th:if="${page.current < page.pages}" th:href="@{/admin/categories(page=${page.current + 1})}">下一页</a>
                <span class="disabled" th:unless="${page.current < page.pages}">下一页</span>
            </nav>
        </footer>
    </section>
</main>
</body>
</html>
