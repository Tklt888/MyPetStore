<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品管理</title>
<style>
body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#1f2937;margin:0}main{width:min(1250px,calc(100% - 36px));margin:32px auto}header,.row,footer{display:flex;gap:12px;align-items:center;justify-content:space-between}.panel{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden}.filters{display:flex;gap:10px;flex-wrap:wrap;padding:16px}input,select,button,.button{min-height:38px;padding:0 12px;border:1px solid #ccd1d8;border-radius:7px;background:#fff;font:inherit}.button,button{background:#2563eb;color:#fff;border:0;text-decoration:none;display:inline-flex;align-items:center}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-top:1px solid #eee;text-align:left}.num{text-align:right}.actions{display:flex;gap:8px;flex-wrap:wrap}.inline{display:inline;padding:0}.inline button{min-height:30px;padding:0 9px}.flash{padding:12px 16px;background:#ecfdf5}.error{background:#fef2f2}.empty{text-align:center;padding:36px}footer{padding:16px}a{color:#2563eb;text-decoration:none}
</style></head>
<body><nav><a th:href="@{/admin/customers}">客户管理</a></nav><main>
<header><div><h1>商品管理</h1><p>支持新增商品、编辑、上下架与补货。</p></div><div><a class="button" th:href="@{/admin/products/new}">新增商品</a>　<a th:href="@{/admin/orders}">订单管理</a>　<a th:href="@{/}">返回首页</a></div></header>
<section class="panel">
<div class="flash" th:if="${message}" th:text="${message}"></div><div class="flash error" th:if="${error}" th:text="${error}"></div>
<form class="filters" method="get" th:action="@{/admin/products}">
<input type="search" name="keyword" placeholder="商品名称或 SKU" th:value="${query.keyword}">
<select name="topCategoryId"><option value="">全部一级分类</option><option th:each="c:${topCategoryOptions}" th:value="${c.parentId}" th:selected="${query.topCategoryId==c.parentId}" th:text="${c.parentName}"></option></select>
<select name="categoryId"><option value="">全部分类</option><option th:each="c:${categoryOptions}" th:value="${c.id}" th:selected="${query.categoryId==c.id}" th:text="|${c.parentName} / ${c.name}|"></option></select>
<select name="status"><option value="">全部状态</option><option value="ON_SALE" th:selected="${query.status=='ON_SALE'}">已上架</option><option value="DRAFT" th:selected="${query.status=='DRAFT'}">草稿</option></select>
<button type="submit">查询</button><a th:href="@{/admin/products}">清空</a></form>
<table><thead><tr><th>ID</th><th>SKU</th><th>名称</th><th>分类</th><th class="num">价格</th><th class="num">库存</th><th>状态</th><th class="num">排序</th><th>操作</th></tr></thead>
<tbody><tr th:each="p:${page.records}"><td th:text="${p.id}"></td><td th:text="${p.sku}"></td><td th:text="${p.name}"></td><td th:text="|${p.topCategoryName} / ${p.categoryName}|"></td><td class="num" th:text="|¥${#numbers.formatDecimal(p.price,1,2)}|"></td><td class="num" th:text="${p.stock}"></td><td th:text="${p.status=='ON_SALE'?'已上架':'草稿'}"></td><td class="num" th:text="${p.sortOrder}"></td><td><div class="actions"><a th:href="@{/admin/products/{id}/edit(id=${p.id})}">编辑</a><a th:href="@{/admin/products/{id}/restock(id=${p.id})}">补货</a><form class="inline" method="post" th:action="@{/admin/products/{id}/status(id=${p.id})}"><input type="hidden" name="status" th:value="${p.status=='ON_SALE'?'DRAFT':'ON_SALE'}"><input type="hidden" name="version" th:value="${p.version}"><input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" th:text="${p.status=='ON_SALE'?'下架':'上架'}"></button></form></div></td></tr>
<tr th:if="${page.records.isEmpty()}"><td class="empty" colspan="9"><p>没有找到符合条件的商品</p><p th:if="${page.pages>0 and page.current>page.pages}">当前页超出范围，<a th:href="@{/admin/products(page=1,keyword=${query.keyword},status=${query.status},topCategoryId=${query.topCategoryId},categoryId=${query.categoryId})}">返回第一页</a> 或 <a th:href="@{/admin/products(page=${page.pages},keyword=${query.keyword},status=${query.status},topCategoryId=${query.topCategoryId},categoryId=${query.categoryId})}">前往最后一页</a>。</p></td></tr></tbody></table>
<footer><span th:text="|共 ${page.total} 条|"></span><nav><a th:if="${page.current>1}" th:href="@{/admin/products(page=${page.current-1},keyword=${query.keyword},status=${query.status},topCategoryId=${query.topCategoryId},categoryId=${query.categoryId})}">上一页</a>　<span th:text="|第 ${page.current} / ${page.pages} 页|"></span>　<a th:if="${page.current<page.pages}" th:href="@{/admin/products(page=${page.current+1},keyword=${query.keyword},status=${query.status},topCategoryId=${query.topCategoryId},categoryId=${query.categoryId})}">下一页</a></nav></footer>
</section></main></body></html>
