<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单管理</title>
<style>body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#1f2937;margin:0}main{width:min(1200px,calc(100% - 36px));margin:32px auto}header,footer{display:flex;justify-content:space-between;align-items:center}.panel{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden}.filters{display:flex;gap:10px;flex-wrap:wrap;padding:16px}input,select,button{min-height:38px;padding:0 12px;border:1px solid #ccd1d8;border-radius:7px;background:#fff;font:inherit}button{background:#2563eb;color:#fff;border:0}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-top:1px solid #eee;text-align:left}.num{text-align:right}.empty{text-align:center;padding:36px}footer{padding:16px}a{color:#2563eb;text-decoration:none}</style></head>
<body><nav><a th:href="@{/admin/customers}">客户管理</a></nav><main><header><div><h1>订单管理</h1><p>查询全站订单并处理已支付订单。</p></div><a th:href="@{/}">返回首页</a></header><section class="panel">
<form class="filters" method="get" th:action="@{/admin/orders}"><input type="search" name="orderNo" maxlength="40" placeholder="完整订单号" th:value="${query.orderNo}"><select name="status"><option value="ALL">全部状态</option><option th:each="entry:${statusLabels}" th:value="${entry.key}" th:selected="${query.status==entry.key}" th:text="${entry.value}"></option></select><select name="pageSize"><option th:each="size:${pageSizeOptions}" th:value="${size}" th:selected="${query.pageSize==size}" th:text="|每页 ${size} 条|"></option></select><button type="submit">查询</button><a th:href="@{/admin/orders}">清空</a></form>
<table><thead><tr><th>订单号</th><th>用户</th><th class="num">金额</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>
<tr th:each="o:${page.records}"><td th:text="${o.orderNo}"></td><td th:text="|${o.displayName}（${o.username}）|"></td><td class="num" th:text="|¥${#numbers.formatDecimal(o.totalAmount,1,2)}|"></td><td th:text="${statusLabels[o.status]}"></td><td th:text="${#temporals.format(o.createdAt,'yyyy-MM-dd HH:mm:ss')}"></td><td><a th:href="@{/admin/orders/{id}(id=${o.id})}">查看详情</a></td></tr>
<tr th:if="${page.records.isEmpty()}"><td colspan="6" class="empty">没有找到符合条件的订单 <span th:if="${page.pages>0 and page.current>page.pages}"><a th:href="@{/admin/orders(page=1,pageSize=${query.pageSize},orderNo=${query.orderNo},status=${query.status})}">返回第一页</a> 或 <a th:href="@{/admin/orders(page=${page.pages},pageSize=${query.pageSize},orderNo=${query.orderNo},status=${query.status})}">前往最后一页</a></span></td></tr></tbody></table>
<footer><span th:text="|共 ${page.total} 条|"></span><nav><a th:if="${page.current>1}" th:href="@{/admin/orders(page=${page.current-1},pageSize=${query.pageSize},orderNo=${query.orderNo},status=${query.status})}">上一页</a>　<span th:text="|第 ${page.current} / ${page.pages} 页|"></span>　<a th:if="${page.current<page.pages}" th:href="@{/admin/orders(page=${page.current+1},pageSize=${query.pageSize},orderNo=${query.orderNo},status=${query.status})}">下一页</a></nav></footer>
</section></main></body></html>
