<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title th:text="${editing?'编辑商品':'新增商品'}"></title><style>body{font-family:system-ui;background:#f5f7fa}main{max-width:760px;margin:32px auto;background:#fff;padding:28px;border-radius:12px}label{display:block;margin:14px 0 5px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:10px}textarea{min-height:110px}.error{color:#b91c1c}.readonly{background:#eee}</style></head><body><main><h1 th:text="${editing?'编辑商品':'新增商品'}"></h1><p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
<form method="post" th:object="${form}" th:action="${editing}?@{/admin/products/{id}(id=${product.id})}:@{/admin/products}"><input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input th:if="${editing}" type="hidden" th:field="*{version}">
<label>SKU</label><input th:if="${!editing}" th:field="*{sku}" maxlength="40"><input th:if="${editing}" class="readonly" th:value="${product.sku}" readonly>
<label>二级分类</label><select th:field="*{categoryId}"><option value="">请选择</option><option th:each="c:${categoryOptions}" th:value="${c.id}" th:text="|${c.parentName} / ${c.name}|"></option></select>
<label>商品名称</label><input th:field="*{name}" maxlength="120"><label>价格</label><input type="number" step="0.01" min="0.01" th:field="*{price}">
<div th:if="${!editing}"><label>初始库存</label><input type="number" min="0" th:field="*{stock}"></div><div th:if="${editing}"><label>当前库存（只读）</label><input class="readonly" th:value="${product.stock}" readonly></div>
<label>简介</label><textarea th:field="*{summary}" maxlength="500"></textarea><label>描述</label><textarea th:field="*{description}"></textarea><label>封面路径</label><input th:field="*{coverImage}" maxlength="255"><label>排序</label><input type="number" min="0" th:field="*{sortOrder}"><p><button type="submit">保存</button></p></form><a th:href="@{/admin/products}">返回商品列表</a></main></body></html>
