<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首页 - MyPetStore</title><link rel="stylesheet" th:href="@{/css/storefront.css}"><script defer th:src="@{/js/motion.js}"></script></head><body>
<header th:replace="~{fragments/shell :: header('home')}"></header><main class="store-shell page home-page">
<section class="hero hero--blue-dog"><img th:src="@{/images/hero-auth-dog.png}" alt="穿黄色衣服的法斗犬"><div class="hero__shade"></div><div class="hero-copy"><span class="hero-tag">新宠季上新</span><h1>自然之选，<br>伴随每一天。</h1><p>从可爱的宠物伙伴到安心日常用品，为毛孩子挑选健康、舒适的生活好物。</p><a class="hero-action" th:href="@{/category}">选购商品 <span>→</span></a></div></section>
<section class="section category-section"><div class="section-head"><div><span class="eyebrow">SHOP BY PET</span><h2>精选分类</h2></div><a th:href="@{/category}">查看全部 →</a></div><div class="category-grid"><a class="category-card category-card--photo" th:each="c,stat:${categories}" th:if="${c.parentId==null}" th:href="@{/category(categoryId=${c.id})}" th:classappend="| category-card--${stat.index%5}|"><img class="category-card__image" th:src="${stat.index%5==0?'/images/products/K9-BGL-03/cover-light.png':(stat.index%5==1?'/images/products/CT-SIA-05/cover-light.png':(stat.index%5==2?'/images/products/AQ-CRF-12/cover-light.png':(stat.index%5==3?'/images/products/BR-CNR-08/cover-light.png':'/images/products/RP-IGU-09/cover-light.png')))}" th:alt="${c.name}"><span class="category-card__shade"></span><span class="category-card__index" th:text="|0${stat.count}|">01</span><span class="category-card__copy"><strong th:text="${c.name}">分类</strong><small th:text="${c.code}">CODE</small></span><span class="category-card__arrow">↗</span></a></div></section>
<section class="section product-section"><div class="section-head"><div><span class="eyebrow">NEW ARRIVAL</span><h2>新品上架</h2></div><a th:href="@{/category(sort='NEWEST')}">查看全部 →</a></div><div class="product-grid"><article class="product-card" th:each="p:${newest}"><a th:href="@{/product(id=${p.id})}"><div class="product-media"><img th:src="${#strings.startsWith(p.coverImage,'images/products/')?'/'+#strings.replace(p.coverImage,'/1.jpg','/cover-light.png'):'/'+p.coverImage}" th:alt="${p.name}" th:style="|view-transition-name:product-${p.id}|"><span class="product-chip">NEW</span><span class="product-type" th:classappend="${#strings.contains(p.categoryName,'宠物')}?' is-pet':' is-supply'" th:text="${#strings.contains(p.categoryName,'宠物')?'活体':'用品'}">类型</span></div><div class="product-body"><small th:text="${p.parentName+' · '+p.categoryName}">分类</small><h3 th:text="${p.name}">商品</h3><p th:text="${p.summary}">简介</p><div class="price-row"><span class="price" th:text="|¥${#numbers.formatDecimal(p.price,1,2)}|">¥0.00</span><span class="round-arrow">＋</span></div></div></a></article><div class="empty" th:if="${newest.isEmpty()}">暂无上架商品</div></div></section>
<section class="section product-section featured-section"><div class="section-head"><div><span class="eyebrow">SELECTED FOR YOU</span><h2>精选推荐</h2></div><a th:href="@{/category}">更多好物 →</a></div><div class="product-grid"><article class="product-card" th:each="p:${featured}"><a th:href="@{/product(id=${p.id})}"><div class="product-media"><img th:src="${#strings.startsWith(p.coverImage,'images/products/')?'/'+#strings.replace(p.coverImage,'/1.jpg','/cover-light.png'):'/'+p.coverImage}" th:alt="${p.name}" th:style="|view-transition-name:featured-${p.id}|"><span class="product-type" th:classappend="${#strings.contains(p.categoryName,'宠物')}?' is-pet':' is-supply'" th:text="${#strings.contains(p.categoryName,'宠物')?'活体':'用品'}">类型</span></div><div class="product-body"><small th:text="${p.parentName+' · '+p.categoryName}">分类</small><h3 th:text="${p.name}">商品</h3><p th:text="${p.summary}"></p><div class="price-row"><span class="price" th:text="|¥${#numbers.formatDecimal(p.price,1,2)}|"></span><span class="round-arrow">→</span></div></div></a></article><div class="empty" th:if="${featured.isEmpty()}">暂无精选商品</div></div></section>
</main><footer th:replace="~{fragments/shell :: footer}"></footer></body></html>
