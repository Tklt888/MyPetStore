<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${product.name+' - MyPetStore'}">商品详情</title>
    <link rel="stylesheet" th:href="@{/css/storefront.css}">
    <script defer th:src="@{/js/motion.js}"></script>
</head>
<body>
<header th:replace="~{fragments/shell :: header('catalog')}"></header>
<main class="store-shell page">
    <div class="flash-message" role="status" th:if="${message}" th:text="${message}"></div>
    <div class="flash-message is-error" role="alert" th:if="${error}" th:text="${error}"></div>
    <div class="product-detail">
        <section>
            <img class="gallery-main" id="productImage" th:src="|/${product.coverImage}|" th:alt="${product.name}" th:style="|view-transition-name:product-${product.id}|">
            <div class="thumbs" th:if="${product.images.size()>1}"><img th:each="image:${product.images}" th:src="|/${image.imagePath}|" th:alt="${image.altText}"></div>
        </section>
        <section class="detail-copy">
            <div class="breadcrumbs"><a th:href="@{/main}">首页</a> / <a th:href="@{/category(categoryId=${product.parentId})}" th:text="${product.parentName}"></a> / <a th:href="@{/category(categoryId=${product.categoryId})}" th:text="${product.categoryName}"></a></div>
            <span class="eyebrow" th:text="${product.sku}">SKU</span>
            <h1 th:text="${product.name}">商品</h1>
            <p th:text="${product.summary}"></p>
            <div class="detail-price" th:text="|¥${#numbers.formatDecimal(product.price,1,2)}|">¥0.00</div>
            <p class="stock" th:classappend="${product.stock==0}?' out'" th:text="${product.stock==0?'当前售罄':'当前库存 '+product.stock+' 件'}"></p>
            <div class="description" th:text="${product.description}"></div>
            <div class="buy-box"><form method="post" th:action="@{/cart/items}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="productId" th:value="${product.id}"><div class="field"><label for="quantity">购买数量</label><div class="inline-qty"><button type="button" data-qty-step="-1" aria-label="减少数量">−</button><input class="control qty" id="quantity" type="number" name="quantity" min="1" max="99" value="1"><button type="button" data-qty-step="1" aria-label="增加数量">＋</button></div></div><button class="primary" th:disabled="${product.stock==0}" th:text="${product.stock==0?'暂时缺货':'加入购物车'}">加入购物车</button></form></div>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
</body>
</html>
