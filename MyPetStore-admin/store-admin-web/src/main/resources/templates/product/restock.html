<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品补货 - MyPetStore</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><a class="skip-link" href="#main-content">跳到主要内容</a><div class="admin-shell"><aside th:replace="~{fragments/admin-shell :: sidebar('product')}"></aside><main class="admin-main" id="main-content" tabindex="-1"><div class="content-container">
<header class="page-header"><div><p class="eyebrow">INVENTORY</p><h1>商品补货</h1><p>库存只能增加，提交后将立即计入当前库存。</p></div><a class="secondary-button" th:href="@{/admin/products}">返回商品列表</a></header>
<div class="flash-message is-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">补货失败</div><section class="restock-card"><h2 class="section-heading">确认商品</h2><div class="product-summary"><div class="summary-cell"><span>商品</span><strong th:text="${product.name}">商品名称</strong></div><div class="summary-cell"><span>SKU</span><strong class="sku" th:text="${product.sku}">SKU</strong></div><div class="summary-cell"><span>当前库存</span><strong th:text="${product.stock}">0</strong></div><div class="summary-cell"><span>补货后库存</span><strong>当前库存 + 增加数量</strong></div></div>
<form method="post" th:object="${form}" th:action="@{/admin/products/{id}/restock(id=${product.id})}"><input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label for="quantity">增加数量 <span class="required">*</span></label><input class="control" id="quantity" type="number" min="1" th:field="*{quantity}" required autofocus><small class="field-help">请输入大于 0 的整数</small></div><div class="form-actions"><button class="primary-save" type="submit">确认补货</button><a class="secondary-button" th:href="@{/admin/products}">取消</a></div></form><div class="restock-note">补货操作只增加库存，不会改变商品价格或上下架状态。</div></section>
</div></main></div></body></html>
