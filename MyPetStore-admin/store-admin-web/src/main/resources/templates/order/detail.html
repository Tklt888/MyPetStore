<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单详情 - MyPetStore</title><link rel="stylesheet" th:href="@{/css/admin.css}"><script defer th:src="@{/js/admin.js}"></script></head><body><a class="skip-link" href="#main-content">跳到主要内容</a><div class="admin-shell"><aside th:replace="~{fragments/admin-shell :: sidebar('order')}"></aside><main class="admin-main" id="main-content" tabindex="-1"><div class="content-container"><header class="page-header"><div><p class="eyebrow">ORDER DETAIL</p><h1>订单详情</h1><p class="order-number" th:text="${order.orderNo}">订单号</p></div><a class="secondary-button" th:href="@{/admin/orders}">返回订单列表</a></header><div class="flash-message" th:if="${message}" th:text="${message}"></div><div class="flash-message is-error" th:if="${error}" th:text="${error}"></div>
<div class="detail-grid"><section class="detail-card"><h2>订单信息</h2><dl class="definition-grid"><div><dt>状态</dt><dd><span class="status-badge" th:classappend="${order.status=='PENDING_PAYMENT'}?' is-pending':(${order.status=='PAID'}?' is-paid':(${order.status=='SHIPPED'}?' is-shipped':(${order.status=='COMPLETED'}?' is-completed':' is-cancelled')))" th:text="${statusLabels[order.status]}">状态</span></dd></div><div><dt>订单金额</dt><dd class="amount" th:text="|¥${#numbers.formatDecimal(order.totalAmount,1,2)}|">¥0.00</dd></div><div><dt>所属用户</dt><dd th:text="|${order.displayName}（${order.username}）|">用户</dd></div><div><dt>创建时间</dt><dd th:text="${#temporals.format(order.createdAt,'yyyy-MM-dd HH:mm:ss')}">时间</dd></div><div th:if="${order.cancelledAt!=null}"><dt>取消时间</dt><dd th:text="${#temporals.format(order.cancelledAt,'yyyy-MM-dd HH:mm:ss')}"></dd></div><div th:if="${order.shippedAt!=null}"><dt>发货时间</dt><dd th:text="${#temporals.format(order.shippedAt,'yyyy-MM-dd HH:mm:ss')}"></dd></div><div th:if="${order.completedAt!=null}"><dt>完成时间</dt><dd th:text="${#temporals.format(order.completedAt,'yyyy-MM-dd HH:mm:ss')}"></dd></div></dl></section>
<section class="detail-card"><h2>收货快照</h2><dl class="definition-grid"><div><dt>收货人</dt><dd th:text="${order.receiverName}">姓名</dd></div><div><dt>联系电话</dt><dd th:text="${order.receiverPhone}">电话</dd></div><div class="wide"><dt>详细地址</dt><dd th:text="${order.receiverAddress}">地址</dd></div></dl></section>
<section class="detail-card full"><h2>支付信息</h2><div th:if="${order.status=='PAID' or order.status=='SHIPPED' or order.status=='COMPLETED'}"><div class="payment-callout">教学模拟支付，不涉及真实资金。</div><dl class="definition-grid"><div><dt>支付方式</dt><dd th:text="${order.paymentMethod}">MOCK</dd></div><div><dt>支付凭证号</dt><dd class="order-number" th:text="${order.paymentNo}">凭证号</dd></div><div><dt>支付时间</dt><dd th:text="${#temporals.format(order.paidAt,'yyyy-MM-dd HH:mm:ss')}">时间</dd></div></dl></div><p class="muted" th:if="${order.status=='PENDING_PAYMENT' or order.status=='CANCELLED'}">该订单未支付。</p></section>
<section class="detail-card full"><h2>商品明细快照</h2><div class="table-scroll"><table class="data-table table-compact"><thead><tr><th>SKU</th><th>成交时名称</th><th class="numeric">单价</th><th class="numeric">数量</th><th class="numeric">小计</th></tr></thead><tbody><tr th:each="item:${order.items}"><td class="sku" th:text="${item.skuSnapshot}"></td><td th:text="${item.productNameSnapshot}"></td><td class="numeric" th:text="|¥${#numbers.formatDecimal(item.unitPrice,1,2)}|"></td><td class="numeric" th:text="${item.quantity}"></td><td class="numeric" th:text="|¥${#numbers.formatDecimal(item.lineAmount,1,2)}|"></td></tr></tbody></table></div></section></div>
<div class="detail-actions" th:if="${order.status=='PAID'}"><form method="post" th:action="@{/admin/orders/{id}/ship(id=${order.id})}" data-confirm="发货后订单状态将变为已发货，请确认商品已经完成出库。" data-confirm-title="确认发货" data-confirm-label="确认发货"><input th:if="${_csrf!=null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="page-action" type="submit">确认发货</button></form></div>
<section class="detail-card" th:if="${order.status=='PAID' or order.status=='PENDING_PAYMENT'}"><h2>编辑收货信息</h2><form method="post" th:action="@{/admin/orders/{id}/shipping-address(id=${order.id})}" ><label>收货人<input class="control" type="text" name="receiverName" maxlength="50" th:value="${order.receiverName}" required></label><label>电话<input class="control" type="tel" name="receiverPhone" maxlength="30" th:value="${order.receiverPhone}" required></label><label>地址<input class="control" type="text" name="receiverAddress" maxlength="255" th:value="${order.receiverAddress}" required></label><button class="compact-button" type="submit">保存收货信息</button></form></section><form method="post" th:action="@{/admin/orders/{id}/archive(id=${order.id})}" th:if="${order.status=='CANCELLED'}" data-confirm="确认删除此订单？"><button class="compact-button" type="submit">删除订单</button></form></div></main></div><dialog th:replace="~{fragments/confirm-dialog :: dialog}"></dialog></body></html>
