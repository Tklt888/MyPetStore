<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单详情</title>
<style>body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#1f2937;margin:0}main{width:min(1050px,calc(100% - 36px));margin:32px auto}.panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-top:1px solid #eee;text-align:left}.num{text-align:right}.flash{padding:12px;background:#ecfdf5}.error{background:#fef2f2}button{padding:10px 16px;background:#2563eb;color:#fff;border:0;border-radius:7px}a{color:#2563eb;text-decoration:none}</style></head>
<body><main><p><a th:href="@{/admin/orders}">← 返回订单列表</a></p><h1>订单详情</h1><div class="flash" th:if="${message}" th:text="${message}"></div><div class="flash error" th:if="${error}" th:text="${error}"></div>
<section class="panel grid"><p>订单号：<strong th:text="${order.orderNo}"></strong></p><p>状态：<strong th:text="${statusLabels[order.status]}"></strong></p><p>用户：<span th:text="|${order.displayName}（${order.username}）|"></span></p><p>总额：<span th:text="|¥${#numbers.formatDecimal(order.totalAmount,1,2)}|"></span></p><p>收货人：<span th:text="${order.receiverName}"></span></p><p>电话：<span th:text="${order.receiverPhone}"></span></p><p>地址：<span th:text="${order.receiverAddress}"></span></p><p>创建时间：<span th:text="${#temporals.format(order.createdAt,'yyyy-MM-dd HH:mm:ss')}"></span></p><p th:if="${order.cancelledAt != null}">取消时间：<span th:text="${#temporals.format(order.cancelledAt,'yyyy-MM-dd HH:mm:ss')}"></span></p><p th:if="${order.shippedAt != null}">发货时间：<span th:text="${#temporals.format(order.shippedAt,'yyyy-MM-dd HH:mm:ss')}"></span></p><p th:if="${order.completedAt != null}">完成时间：<span th:text="${#temporals.format(order.completedAt,'yyyy-MM-dd HH:mm:ss')}"></span></p></section>
<section class="panel" th:if="${order.status=='PAID' or order.status=='SHIPPED' or order.status=='COMPLETED'}"><h2>支付信息</h2><p>支付方式：<strong th:text="${order.paymentMethod}"></strong></p><p>成功凭证：<span th:text="${order.paymentNo}"></span></p><p>支付时间：<span th:text="${#temporals.format(order.paidAt,'yyyy-MM-dd HH:mm:ss')}"></span></p></section><section class="panel" th:if="${order.status=='PENDING_PAYMENT' or order.status=='CANCELLED'}"><h2>支付信息</h2><p>未支付</p></section>
<section class="panel"><h2>商品快照</h2><table><thead><tr><th>SKU</th><th>成交时名称</th><th class="num">单价</th><th class="num">数量</th><th class="num">小计</th></tr></thead><tbody><tr th:each="item:${order.items}"><td th:text="${item.skuSnapshot}"></td><td th:text="${item.productNameSnapshot}"></td><td class="num" th:text="|¥${#numbers.formatDecimal(item.unitPrice,1,2)}|"></td><td class="num" th:text="${item.quantity}"></td><td class="num" th:text="|¥${#numbers.formatDecimal(item.lineAmount,1,2)}|"></td></tr></tbody></table></section>
<section class="panel" th:if="${order.status=='PAID'}"><form method="post" th:action="@{/admin/orders/{id}/ship(id=${order.id})}" onsubmit="return confirm('确认将此订单标记为已发货？')"><input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">确认发货</button></form></section>
</main></body></html>
