<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册 - MyPetStore</title><link rel="stylesheet" th:href="@{/css/storefront.css}"></head><body class="auth-page auth-page--register">
<main class="auth-shell auth-shell--register">
<section class="auth-visual auth-visual--hero"><img th:src="@{/images/hero-auth-dog.png}" alt="穿黄色衣服的法斗犬"><div class="auth-visual__shade"></div><a class="auth-brand" th:href="@{/main}" aria-label="MyPetStore 首页"><svg th:replace="~{fragments/shell :: brandMark}"></svg><b>MyPetStore</b></a><div class="auth-visual__copy"><span class="eyebrow">JOIN THE FAMILY</span><h1>加入我们</h1><p>注册 MyPetStore 账号，发现精选宠物与生活用品，给它更好的生活。</p></div></section>
<section class="auth-form-panel"><a class="auth-back" th:href="@{/main}">← 返回商城</a><div class="auth-heading"><span class="eyebrow">CREATE ACCOUNT</span><h1>创建商城账号</h1><p>填写基本信息，即可开始选购。</p></div><div class="flash-message is-error" role="alert" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/register}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="auth-field-grid"><div class="field"><label for="username">用户名</label><input class="control" id="username" name="username" maxlength="50" th:value="${username}" required></div><div class="field"><label for="displayName">显示名称</label><input class="control" id="displayName" name="displayName" maxlength="50" th:value="${displayName}" required></div></div><div class="field"><label for="password">密码（8—72 位）</label><input class="control" id="password" type="password" name="password" minlength="8" maxlength="72" required></div><div class="auth-field-grid"><div class="field"><label for="email">邮箱（可选）</label><input class="control" id="email" type="email" name="email" maxlength="100" th:value="${email}"></div><div class="field"><label for="phone">手机号（可选）</label><input class="control" id="phone" name="phone" maxlength="30" th:value="${phone}"></div></div><div class="field"><label for="captcha">验证码</label><div class="captcha-row"><input class="control" id="captcha" name="captcha" maxlength="4" inputmode="numeric" placeholder="输入四位数字" required><img th:src="@{/captcha.svg}" alt="四位数字验证码" onclick="this.src='/captcha.svg?'+Date.now()"></div></div><button class="primary auth-submit">注册账号</button></form><div class="auth-switch">已有账号？ <a th:href="@{/login}">返回登录</a></div></section>
</main></body></html>
