<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>商品补货</title><style>body{font-family:system-ui;background:#f5f7fa}main{max-width:600px;margin:40px auto;background:#fff;padding:28px;border-radius:12px}input,button{width:100%;box-sizing:border-box;padding:10px;margin:8px 0}.error{color:#b91c1c}</style></head><body><main><h1>商品补货</h1><p th:text="|${product.sku}　${product.name}|"></p><p th:text="|当前库存：${product.stock}|"></p><p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p><form method="post" th:object="${form}" th:action="@{/admin/products/{id}/restock(id=${product.id})}"><input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{version}"><label>增加数量</label><input type="number" min="1" th:field="*{quantity}"><button type="submit">确认补货</button></form><a th:href="@{/admin/products}">返回商品列表</a></main></body></html>
