<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户管理 - MyPetStore</title><link rel="stylesheet" th:href="@{/css/admin.css}"><script defer th:src="@{/js/admin.js}"></script></head><body><a class="skip-link" href="#main-content">跳到主要内容</a><div class="admin-shell"><aside th:replace="~{fragments/admin-shell :: sidebar('customer')}"></aside><main class="admin-main" id="main-content" tabindex="-1"><div class="content-container"><header class="page-header"><div><p class="eyebrow">CUSTOMER ACCOUNTS</p><h1>客户管理</h1><p>查询普通客户，并安全管理账号的启用状态。</p></div></header><div class="flash-message" role="status" th:if="${message}" th:text="${message}">操作成功</div>
<section class="filter-card"><h2 class="section-heading">筛选客户</h2><form class="filter-grid" method="get" th:action="@{/admin/customers}"><div class="control-group"><label for="keyword">用户名</label><input class="control" id="keyword" type="search" name="keyword" maxlength="50" placeholder="输入用户名" th:value="${query.keyword}"></div><div class="control-group"><label for="status">账号状态</label><select class="control" id="status" name="status"><option value="ALL">全部状态</option><option value="ENABLED" th:selected="${query.status=='ENABLED'}">已启用</option><option value="DISABLED" th:selected="${query.status=='DISABLED'}">已禁用</option></select></div><div class="control-group"><label for="pageSize">每页条数</label><select class="control" id="pageSize" name="pageSize"><option th:each="size:${pageSizeOptions}" th:value="${size}" th:selected="${query.pageSize==size}" th:text="|每页 ${size} 条|"></option></select></div><button class="filter-submit" type="submit">查询</button><a class="secondary-button" th:href="@{/admin/customers}">清空</a></form></section>
<section class="data-card"><div class="table-scroll"><table class="data-table"><thead><tr><th>用户名</th><th>显示名</th><th>邮箱</th><th>手机号</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody><tr th:each="customer:${page.records}" th:id="|row-customers-${customer.id}|"><td class="account-id" th:text="${customer.username}">username</td><td th:text="${customer.displayName}">显示名</td><td th:text="${customer.email}">邮箱</td><td th:text="${customer.phone}?:'—'">—</td><td><span class="status-badge" th:classappend="${customer.status=='ENABLED'}?' is-on':' is-off'" th:text="${customer.status=='ENABLED'?'已启用':'已禁用'}">已启用</span></td><td th:text="${#temporals.format(customer.createdAt,'yyyy-MM-dd HH:mm:ss')}">时间</td><td><form class="inline-form" method="post" th:action="@{/admin/customers/{id}/status(id=${customer.id})}" th:attr="data-confirm=${customer.status=='ENABLED'?'禁用后该客户将无法登录，确定继续吗？':'启用后该客户可以重新登录，确定继续吗？'},data-confirm-title=${customer.status=='ENABLED'?'禁用客户账号':'启用客户账号'},data-confirm-label=${customer.status=='ENABLED'?'确认禁用':'确认启用'}"><input type="hidden" name="targetStatus" th:value="${customer.status=='ENABLED'?'DISABLED':'ENABLED'}"><input th:if="${_csrf!=null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="compact-button" th:classappend="${customer.status=='ENABLED'}?' danger-outline'" type="submit" th:text="${customer.status=='ENABLED'?'禁用':'启用'}">禁用</button></form></td></tr><tr th:if="${page.records.isEmpty()}"><td class="empty-state" colspan="7"><strong>没有找到符合条件的客户</strong><p><a class="text-action" th:href="@{/admin/customers}">清空筛选</a></p><p th:if="${page.pages>0 and page.current>page.pages}"><a class="text-action" th:href="@{/admin/customers(page=1,pageSize=${query.pageSize},keyword=${query.keyword},status=${query.status})}">返回第一页</a> 或 <a class="text-action" th:href="@{/admin/customers(page=${page.pages},pageSize=${query.pageSize},keyword=${query.keyword},status=${query.status})}">前往最后一页</a></p></td></tr></tbody></table></div><footer class="table-footer"><span th:text="|共 ${page.total} 位客户 · 第 ${page.current} / ${page.pages==0?1:page.pages} 页|">共 0 位</span><nav class="pagination"><a th:if="${page.current>1}" th:href="@{/admin/customers(page=${page.current-1},pageSize=${query.pageSize},keyword=${query.keyword},status=${query.status})}">上一页</a><span class="page-current" th:text="${page.current}">1</span><a th:if="${page.current<page.pages}" th:href="@{/admin/customers(page=${page.current+1},pageSize=${query.pageSize},keyword=${query.keyword},status=${query.status})}">下一页</a></nav></footer></section>
</div></main></div><dialog th:replace="~{fragments/confirm-dialog :: dialog}"></dialog></body></html>
