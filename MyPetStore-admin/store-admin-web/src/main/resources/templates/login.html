<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 - MyPetStore 管理端</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><main class="login-page">
<section class="login-aside" aria-labelledby="brand-title">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><circle cx="7.5" cy="10" r="3"/><circle cx="13.2" cy="5.5" r="3"/><circle cx="18.8" cy="5.5" r="3"/><circle cx="24.5" cy="10" r="3"/><path d="M16 12.5c-4.5 0-9.2 5.6-9.2 10.2 0 3.6 3 5.5 6.2 4.2 2-.8 4-.8 6 0 3.2 1.3 6.2-.6 6.2-4.2 0-4.6-4.7-10.2-9.2-10.2Z"/></svg></span><span class="brand-copy"><strong>MyPetStore</strong><span>商城管理端</span></span></div>
    <div class="login-message"><p class="eyebrow">PET STORE OPERATIONS</p><h1 id="brand-title">让每一次运营<br>都清楚、可靠。</h1><p>在一个简洁的工作空间中管理商品分类、库存、订单和客户账号。</p></div>
    <div class="login-decoration" aria-hidden="true"></div><span class="login-note">仅限商城管理员使用</span>
</section>
<section class="login-content" aria-labelledby="login-title"><div class="login-card">
    <h2 id="login-title">欢迎回来</h2><p>使用管理员账号进入运营后台。</p>
    <div class="alert" role="status" th:if="${message}" th:text="${message}">账号或密码错误，或账号不可用</div>
    <form method="post" th:action="@{/login}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-field"><label for="username">管理员账号</label><input id="username" name="username" type="text" th:value="${username}" autocomplete="username" maxlength="50" required autofocus></div>
        <div class="form-field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="primary-button" type="submit">登录管理端</button>
    </form><p class="login-help">遇到账号问题，请联系系统管理员。</p>
</div></section>
</main></body></html>
