<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<svg th:fragment="brandMark" class="brand__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="7.5" cy="10" r="3"/><circle cx="13.2" cy="5.5" r="3"/><circle cx="18.8" cy="5.5" r="3"/><circle cx="24.5" cy="10" r="3"/><path d="M16 12.5c-4.5 0-9.2 5.6-9.2 10.2 0 3.6 3 5.5 6.2 4.2 2-.8 4-.8 6 0 3.2 1.3 6.2-.6 6.2-4.2 0-4.6-4.7-10.2-9.2-10.2Z"/></svg>
<header class="site-header" th:fragment="header(active)">
    <div class="store-shell site-header__top">
        <a class="brand" th:href="@{/main}" aria-label="MyPetStore 首页"><svg th:replace="~{fragments/shell :: brandMark}"></svg><b>MyPetStore</b></a>
        <nav class="top-actions" aria-label="主导航"><a class="nav-link" th:classappend="${active=='home'}?' is-active'" th:href="@{/main}">首页</a><a class="nav-link" th:classappend="${active=='catalog'}?' is-active'" th:href="@{/category}">选购</a><a class="nav-link" th:classappend="${active=='orders'}?' is-active'" th:href="@{/orders}">我的订单</a></nav>
        <form class="header-search" method="get" th:action="@{/category}" role="search"><input type="search" name="keyword" placeholder="搜索商品名称…" aria-label="搜索商品"><button type="submit" aria-label="提交搜索">⌕</button></form>
        <a class="cart-link" th:classappend="${active=='cart'}?' is-active'" th:href="@{/cart}" aria-label="购物车"><span aria-hidden="true">🛒</span><b th:text="${cartCount}">0</b></a>
        <div class="user-menu" th:if="${currentUser!=null}"><span class="user-avatar" aria-hidden="true">人</span><span th:text="${currentUser.displayName}">用户</span><form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link-button">退出</button></form></div>
        <a class="login-link" th:if="${currentUser==null}" th:href="@{/login}">登录</a>
    </div>
</header>
<footer class="site-footer" th:fragment="footer">
    <div class="store-shell footer-grid"><div class="footer-brand"><div class="brand"><svg th:replace="~{fragments/shell :: brandMark}"></svg><b>MyPetStore</b></div><p>从宠物伙伴到日常用品，为每一份陪伴认真挑选。</p></div><div><strong>快速链接</strong><a th:href="@{/main}">商城首页</a><a th:href="@{/category}">选购商品</a><a th:href="@{/orders}">我的订单</a></div><div><strong>服务说明</strong><p>安心选购宠物与生活用品<br>便捷管理购物车和订单</p></div></div>
    <div class="store-shell footer-bottom">© 2026 MyPetStore · 陪伴每一天</div>
</footer>
</body></html>
