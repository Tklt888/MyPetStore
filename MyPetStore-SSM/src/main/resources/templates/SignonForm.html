<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 - MyPetStore</title><link rel="stylesheet" th:href="@{/css/storefront.css}"></head><body class="auth-page">
<main class="auth-shell">
<section class="auth-visual auth-visual--hero"><img th:src="@{/images/login-cat-sage.png}" alt="浅绿色背景中的布偶猫"><div class="auth-visual__shade"></div><a class="auth-brand" th:href="@{/main}" aria-label="MyPetStore 首页"><svg th:replace="~{fragments/shell :: brandMark}"></svg><b>MyPetStore</b></a><div class="auth-visual__copy"><span class="eyebrow">WELCOME BACK</span><h1>欢迎回来</h1><p>登录 MyPetStore，为您的爱宠挑选天然、健康的生活好物。</p></div></section>
<section class="auth-form-panel"><a class="auth-back" th:href="@{/main}">← 返回商城</a><div class="auth-heading"><span class="eyebrow">ACCOUNT SIGN IN</span><h1>账号登录</h1><p>登录后可以使用持久购物车、下单和查看订单。</p></div><div class="flash-message" role="status" th:if="${message}" th:text="${message}"></div><div class="flash-message is-error" role="alert" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/login}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label for="username">用户名</label><input class="control" id="username" name="username" maxlength="50" autocomplete="username" placeholder="请输入用户名" required></div><div class="field"><label for="password">密码</label><input class="control" id="password" type="password" name="password" autocomplete="current-password" placeholder="请输入密码" required></div><div class="field"><label for="captcha">验证码</label><div class="captcha-row"><input class="control" id="captcha" name="captcha" maxlength="4" inputmode="numeric" placeholder="输入四位数字" required><img th:src="@{/captcha.svg}" alt="四位数字验证码" onclick="this.src='/captcha.svg?'+Date.now()" title="点击换一张"></div><small class="field-help">看不清？点击图片换一张</small></div><button class="primary auth-submit">登 录</button></form><div class="auth-switch">还没有账号？ <a th:href="@{/register}">立即注册</a></div></section>
</main></body></html>
