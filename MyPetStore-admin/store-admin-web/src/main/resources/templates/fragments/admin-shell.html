<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><body>
<aside class="admin-sidebar" th:fragment="sidebar(active)">
 <a class="brand" th:href="@{/}" aria-label="返回管理端控制台"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><circle cx="7.5" cy="10" r="3"/><circle cx="13.2" cy="5.5" r="3"/><circle cx="18.8" cy="5.5" r="3"/><circle cx="24.5" cy="10" r="3"/><path d="M16 12.5c-4.5 0-9.2 5.6-9.2 10.2 0 3.6 3 5.5 6.2 4.2 2-.8 4-.8 6 0 3.2 1.3 6.2-.6 6.2-4.2 0-4.6-4.7-10.2-9.2-10.2Z"/></svg></span><span class="brand-copy"><strong>MyPetStore</strong><span>商城管理端</span></span></a>
 <nav class="admin-nav" aria-label="主要导航">
  <a class="nav-item" th:classappend="${active == 'home'} ? ' is-active'" th:href="@{/}"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-3H4v3Zm10 0h6v-9h-6v9Zm0-16v3h6V4h-6Z"/></svg>控制台</a>
  <a class="nav-item" th:classappend="${active == 'category'} ? ' is-active'" th:href="@{/admin/categories}"><svg viewBox="0 0 24 24"><path d="M4 5h6v6H4V5Zm10 0h6v6h-6V5ZM4 15h6v4H4v-4Zm10 0h6v4h-6v-4Z"/></svg>分类管理</a>
  <a class="nav-item" th:classappend="${active == 'product'} ? ' is-active'" th:href="@{/admin/products}"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4V7Zm4 0V4h8v3M4 11h16"/></svg>商品管理</a>
  <a class="nav-item" th:classappend="${active == 'order'} ? ' is-active'" th:href="@{/admin/orders}"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Zm3 5h6m-6 4h6"/></svg><span>订单管理</span><span class="nav-count" th:if="${pendingShipmentCount != null and pendingShipmentCount > 0}" th:text="${pendingShipmentCount}" aria-label="待发货订单数">3</span></a>
  <a class="nav-item" th:classappend="${active == 'customer'} ? ' is-active'" th:href="@{/admin/customers}"><svg viewBox="0 0 24 24"><path d="M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm8 1a3 3 0 1 0 0-6M2 21v-3a5 5 0 0 1 10 0v3m1-7a5 5 0 0 1 9 3v4"/></svg>客户管理</a>
 </nav><div class="sidebar-account"><div class="account-profile"><span class="account-avatar" th:text="${adminDisplayName != null and !adminDisplayName.isEmpty() ? #strings.substring(adminDisplayName,0,1) : '管'}">管</span><div><strong th:text="${adminDisplayName != null ? adminDisplayName : '商城管理员'}">商城管理员</strong><span th:text="${adminUsername != null ? adminUsername : 'admin'}">admin</span></div></div><form method="post" th:action="@{/logout}"><input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="logout-button" type="submit">安全退出</button></form></div>
</aside><script defer th:src="@{/js/motion.js}"></script></body></html>
