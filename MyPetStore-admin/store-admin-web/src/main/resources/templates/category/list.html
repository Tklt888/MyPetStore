<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分类管理 - MyPetStore</title><link rel="stylesheet" th:href="@{/css/admin.css}"><script defer th:src="@{/js/admin.js}"></script></head><body><a class="skip-link" href="#main-content">跳到主要内容</a><div class="admin-shell"><aside th:replace="~{fragments/admin-shell :: sidebar('category')}"></aside><main class="admin-main" id="main-content" tabindex="-1"><div class="content-container">
<header class="page-header"><div><p class="eyebrow">CATEGORY STRUCTURE</p><h1>分类管理</h1><p>维护商城使用的两级分类，编码与父子关系创建后不可修改。</p></div><a class="page-action" th:href="@{/admin/categories/new}">＋ 新增一级分类</a></header><div class="flash-message" role="status" th:if="${message}" th:text="${message}">操作成功</div><div class="flash-message is-error" role="alert" th:if="${error}" th:text="${error}">操作失败</div>
<section class="data-card" aria-label="分类列表"><div class="table-scroll"><table class="data-table table-compact"><thead><tr><th>层级</th><th>编码</th><th>分类名称</th><th>父分类</th><th class="numeric">排序</th><th>操作</th></tr></thead><tbody th:each="top:${page.records}"><tr th:id="|row-categories-${top.id}|"><td><span class="level-badge">一级</span></td><td class="sku" th:text="${top.code}">DOGS</td><td class="category-name"><strong th:text="${top.name}">犬类</strong></td><td class="muted">—</td><td class="numeric" th:text="${top.sortOrder}">10</td><td><div class="row-actions"><a th:href="@{/admin/categories/new(parentId=${top.id})}">新增子分类</a><a th:href="@{/admin/categories/{id}/edit(id=${top.id})}">编辑</a><form class="inline-form" method="post" th:action="@{/admin/categories/{id}/delete(id=${top.id})}" data-confirm="删除后无法恢复；若分类仍被使用，系统会拒绝删除。" data-confirm-title="删除一级分类" data-confirm-label="确认删除"><input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-action is-danger" type="submit">删除</button></form></div></td></tr><tr class="tree-child" th:each="child:${top.children}" th:id="|row-categories-${child.id}|"><td><span class="level-badge is-child">二级</span></td><td class="sku" th:text="${child.code}">DOGS_PETS</td><td class="category-name"><strong th:text="${child.name}">宠物</strong></td><td class="muted" th:text="${top.name}">犬类</td><td class="numeric" th:text="${child.sortOrder}">10</td><td><div class="row-actions"><a th:href="@{/admin/categories/{id}/edit(id=${child.id})}">编辑</a><form class="inline-form" method="post" th:action="@{/admin/categories/{id}/delete(id=${child.id})}" data-confirm="删除后无法恢复；若分类仍被使用，系统会拒绝删除。" data-confirm-title="删除二级分类" data-confirm-label="确认删除"><input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-action is-danger" type="submit">删除</button></form></div></td></tr></tbody><tbody th:if="${page.records.isEmpty()}"><tr><td class="empty-state" colspan="6"><strong>暂无分类</strong><p>请先创建一个一级分类。</p><p th:if="${page.pages>0 and page.current>page.pages}">当前页已超出范围，<a class="text-action" th:href="@{/admin/categories(page=1)}">返回第一页</a> 或 <a class="text-action" th:href="@{/admin/categories(page=${page.pages})}">前往最后一页</a>。</p></td></tr></tbody></table></div><footer class="table-footer"><span th:text="|共 ${page.total} 个一级分类 · 第 ${page.current} / ${page.pages==0?1:page.pages} 页|">共 0 个</span><nav class="pagination" aria-label="分类分页"><a th:if="${page.current>1}" th:href="@{/admin/categories(page=${page.current-1})}">上一页</a><span class="page-current" th:text="${page.current}">1</span><a th:if="${page.current<page.pages}" th:href="@{/admin/categories(page=${page.current+1})}">下一页</a></nav></footer></section>
</div></main></div><!-- confirm() legacy behavior is replaced by the native dialog below. --><dialog th:replace="~{fragments/confirm-dialog :: dialog}"></dialog></body></html>
