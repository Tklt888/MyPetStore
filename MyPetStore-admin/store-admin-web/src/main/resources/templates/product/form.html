<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${editing?'编辑商品 - MyPetStore':'新增商品 - MyPetStore'}">商品表单</title><link rel="stylesheet" th:href="@{/css/admin.css}"><script defer th:src="@{/js/admin.js}"></script></head><body><a class="skip-link" href="#main-content">跳到主要内容</a><div class="admin-shell"><aside th:replace="~{fragments/admin-shell :: sidebar('product')}"></aside><main class="admin-main" id="main-content" tabindex="-1"><div class="content-container">
<header class="page-header"><div><p class="eyebrow">PRODUCT DETAILS</p><h1 th:text="${editing?'编辑商品':'新增商品'}">新增商品</h1><p th:text="${editing?'修改商品的展示资料、价格和排序。':'创建商品后默认为下架状态，可确认信息后再上架。'}">填写商品资料。</p></div><a class="secondary-button" th:href="@{/admin/products}">返回商品列表</a></header>
<div class="flash-message is-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">请检查表单内容</div>
<form method="post" th:object="${form}" th:action="${editing}?@{/admin/products/{id}(id=${product.id})}:@{/admin/products}"><input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input th:if="${editing}" type="hidden" th:field="*{version}"><div class="form-layout"><div class="form-card">
<section class="form-section" aria-labelledby="basic-title"><h2 id="basic-title">基础信息</h2><div class="field-grid"><div class="field"><label for="sku">SKU <span class="required">*</span></label><input class="control" id="sku" th:if="${!editing}" th:field="*{sku}" maxlength="40" required><div class="readonly-wrap" th:if="${editing}"><input class="control" id="sku" th:value="${product.sku}" readonly></div><small class="field-help" th:if="${editing}">SKU 创建后不可修改</small></div><div class="field"><label for="categoryId">二级分类 <span class="required">*</span></label><select class="control" id="categoryId" th:field="*{categoryId}" required><option value="">请选择分类</option><option th:each="c:${categoryOptions}" th:value="${c.id}" th:text="|${c.parentName} / ${c.name}|"></option></select></div></div><div class="field"><label for="name">商品名称 <span class="required">*</span></label><input class="control" id="name" th:field="*{name}" maxlength="120" required></div><div class="field"><label for="summary">商品简介</label><textarea class="control" id="summary" th:field="*{summary}" maxlength="500" placeholder="用简短文字概括商品特点"></textarea><small class="field-help">最多 500 个字符</small></div><div class="field"><label for="description">商品描述</label><textarea class="control description" id="description" th:field="*{description}" placeholder="输入纯文本商品描述，换行会被保留"></textarea></div></section>
<section class="form-section" aria-labelledby="sale-title"><h2 id="sale-title">销售信息</h2><div class="field-grid"><div class="field"><label for="price">价格 <span class="required">*</span></label><input class="control" id="price" type="number" step="0.01" min="0.01" th:field="*{price}" required></div><div class="field" th:if="${!editing}"><label for="stock">初始库存 <span class="required">*</span></label><input class="control" id="stock" type="number" min="0" th:field="*{stock}" required></div><div class="field" th:if="${editing}"><label for="stock">当前库存</label><div class="readonly-wrap"><input class="control" id="stock" th:value="${product.stock}" readonly></div><small class="field-help">请使用独立的补货操作增加库存</small></div></div><div class="field-grid"><div class="field"><label for="coverImage">封面路径 <span class="required">*</span></label><input class="control" id="coverImage" th:field="*{coverImage}" maxlength="255" required><small class="field-help">填写项目静态图片的相对路径</small></div><div class="field"><label for="sortOrder">排序值 <span class="required">*</span></label><input class="control" id="sortOrder" type="number" min="0" th:field="*{sortOrder}" required><small class="field-help">数值越小，展示位置越靠前</small></div></div></section>
<div class="form-actions"><button class="primary-save" type="submit" th:text="${editing?'保存修改':'创建商品'}">保存</button><a class="secondary-button" th:href="@{/admin/products}">取消</a></div></div>
<aside class="form-aside"><h2>填写提示</h2><ul><li>商品名称应清楚描述具体商品。</li><li>价格最多保留两位小数。</li><li>创建完成后商品默认为下架。</li><li th:if="${editing}">SKU 与库存不可在编辑页直接修改。</li></ul></aside></div></form>
<form method="post" th:action="@{/admin/products/{id}/archive(id=${product.id})}" th:if="${editing}" data-confirm="确认删除此商品？"><input type="hidden" name="version" th:value="${product.version}"><button class="compact-button" type="submit">删除商品</button></form></div></main></div><dialog th:replace="~{fragments/confirm-dialog :: dialog}"></dialog></body></html>
