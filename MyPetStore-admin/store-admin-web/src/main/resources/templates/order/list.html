<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单管理 - MyPetStore</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><a class="skip-link" href="#main-content">跳到主要内容</a><div class="admin-shell"><aside th:replace="~{fragments/admin-shell :: sidebar('order')}"></aside><main class="admin-main" id="main-content" tabindex="-1"><div class="content-container order-page"><header class="page-header"><div><p class="eyebrow">ORDER FULFILLMENT</p><h1>订单管理</h1><p>按完整订单号和状态查询订单，并处理已支付订单。</p></div></header>
<section class="filter-card"><h2 class="section-heading">筛选订单</h2><form class="filter-grid order-filter-grid" method="get" th:action="@{/admin/orders}"><div class="control-group"><label for="orderNo">完整订单号</label><input class="control" id="orderNo" type="search" name="orderNo" maxlength="40" placeholder="输入完整订单号" th:value="${query.orderNo}"></div><div class="control-group"><label for="status">订单状态</label><select class="control" id="status" name="status"><option value="ALL">全部状态</option><option th:each="entry:${statusLabels}" th:value="${entry.key}" th:selected="${query.status==entry.key}" th:text="${entry.value}"></option></select></div><div class="control-group"><label for="pageSize">每页条数</label><select class="control" id="pageSize" name="pageSize"><option th:each="size:${pageSizeOptions}" th:value="${size}" th:selected="${query.pageSize==size}" th:text="|每页 ${size} 条|"></option></select></div><button class="filter-submit" type="submit">查询</button><a class="secondary-button" th:href="@{/admin/orders}">清空</a></form></section>
<section class="data-card order-table-card"><div class="table-scroll"><table class="data-table order-data-table"><thead><tr><th class="col-order-no">订单号</th><th class="col-customer">用户</th><th class="numeric col-amount">金额</th><th class="col-status">状态</th><th class="col-created">创建时间</th><th class="col-actions">操作</th></tr></thead><tbody><tr th:each="o:${page.records}" th:id="|row-orders-${o.id}|"><td class="order-number col-order-no" th:text="${o.orderNo}" th:title="${o.orderNo}">NO</td><td class="customer-cell col-customer"><strong th:text="${o.displayName}">用户</strong><small th:text="${o.username}">username</small></td><td class="numeric col-amount" th:text="|¥${#numbers.formatDecimal(o.totalAmount,1,2)}|">¥0.00</td><td class="col-status"><span class="status-badge" th:classappend="${o.status=='PENDING_PAYMENT'}?' is-pending':(${o.status=='PAID'}?' is-paid':(${o.status=='SHIPPED'}?' is-shipped':(${o.status=='COMPLETED'}?' is-completed':' is-cancelled')))" th:text="${statusLabels[o.status]}">状态</span></td><td class="col-created" th:text="${#temporals.format(o.createdAt,'yyyy-MM-dd HH:mm:ss')}">时间</td><td class="col-actions"><a class="text-action" th:href="@{/admin/orders/{id}(id=${o.id})}">查看详情</a></td></tr><tr th:if="${page.records.isEmpty()}"><td class="empty-state" colspan="6"><strong>没有找到符合条件的订单</strong><p><a class="text-action" th:href="@{/admin/orders}">清空筛选</a></p><p th:if="${page.pages>0 and page.current>page.pages}"><a class="text-action" th:href="@{/admin/orders(page=1,pageSize=${query.pageSize},orderNo=${query.orderNo},status=${query.status})}">返回第一页</a> 或 <a class="text-action" th:href="@{/admin/orders(page=${page.pages},pageSize=${query.pageSize},orderNo=${query.orderNo},status=${query.status})}">前往最后一页</a></p></td></tr></tbody></table></div><footer class="table-footer"><span th:text="|共 ${page.total} 笔订单 · 第 ${page.current} / ${page.pages==0?1:page.pages} 页|">共 0 笔</span><nav class="pagination"><a th:if="${page.current>1}" th:href="@{/admin/orders(page=${page.current-1},pageSize=${query.pageSize},orderNo=${query.orderNo},status=${query.status})}">上一页</a><span class="page-current" th:text="${page.current}">1</span><a th:if="${page.current<page.pages}" th:href="@{/admin/orders(page=${page.current+1},pageSize=${query.pageSize},orderNo=${query.orderNo},status=${query.status})}">下一页</a></nav></footer></section>
</div></main></div></body></html>
