<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户管理</title>
<style>body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#1f2937;margin:0}main{width:min(1200px,calc(100% - 36px));margin:32px auto}header,footer{display:flex;justify-content:space-between;align-items:center}.panel{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden}.filters{display:flex;gap:10px;flex-wrap:wrap;padding:16px}input,select,button{min-height:38px;padding:0 12px;border:1px solid #ccd1d8;border-radius:7px;background:#fff;font:inherit}button{background:#2563eb;color:#fff;border:0}.danger{background:#b91c1c}.success{background:#15803d}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-top:1px solid #eee;text-align:left}.empty{text-align:center;padding:36px}footer{padding:16px}a{color:#2563eb;text-decoration:none}.message{padding:12px;background:#dcfce7}</style></head>
<body><main><header><div><h1>客户管理</h1><p>查询普通客户并安全启用或禁用账号。</p></div><a th:href="@{/}">返回首页</a></header><p class="message" th:if="${message}" th:text="${message}"></p><section class="panel">
<form class="filters" method="get" th:action="@{/admin/customers}"><input type="search" name="keyword" maxlength="50" placeholder="用户名" th:value="${query.keyword}"><select name="status"><option value="ALL">全部状态</option><option value="ENABLED" th:selected="${query.status=='ENABLED'}">已启用</option><option value="DISABLED" th:selected="${query.status=='DISABLED'}">已禁用</option></select><select name="pageSize"><option th:each="size:${pageSizeOptions}" th:value="${size}" th:selected="${query.pageSize==size}" th:text="|每页 ${size} 条|"></option></select><button type="submit">查询</button><a th:href="@{/admin/customers}">清空筛选</a></form>
<table><thead><tr><th>用户名</th><th>显示名</th><th>邮箱</th><th>手机号</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>
<tr th:each="customer:${page.records}"><td th:text="${customer.username}"></td><td th:text="${customer.displayName}"></td><td th:text="${customer.email}"></td><td th:text="${customer.phone}"></td><td th:text="${customer.status=='ENABLED'?'已启用':'已禁用'}"></td><td th:text="${#temporals.format(customer.createdAt,'yyyy-MM-dd HH:mm:ss')}"></td><td><form method="post" th:action="@{/admin/customers/{id}/status(id=${customer.id})}" onsubmit="return confirm('确认修改该客户账号状态吗？')"><input type="hidden" name="targetStatus" th:value="${customer.status=='ENABLED'?'DISABLED':'ENABLED'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button th:class="${customer.status=='ENABLED'?'danger':'success'}" th:text="${customer.status=='ENABLED'?'禁用':'启用'}"></button></form></td></tr>
<tr th:if="${page.records.isEmpty()}"><td colspan="7" class="empty">没有找到符合条件的客户。<a th:href="@{/admin/customers}">清空筛选</a><span th:if="${page.pages>0 and page.current>page.pages}">　<a th:href="@{/admin/customers(page=${page.pages},pageSize=${query.pageSize},keyword=${query.keyword},status=${query.status})}">前往最后一页</a></span></td></tr></tbody></table>
<footer><span th:text="|共 ${page.total} 条|"></span><nav><a th:if="${page.current>1}" th:href="@{/admin/customers(page=${page.current-1},pageSize=${query.pageSize},keyword=${query.keyword},status=${query.status})}">上一页</a>　<span th:text="|第 ${page.current} / ${page.pages} 页|"></span>　<a th:if="${page.current<page.pages}" th:href="@{/admin/customers(page=${page.current+1},pageSize=${query.pageSize},keyword=${query.keyword},status=${query.status})}">下一页</a></nav></footer>
</section></main></body></html>
