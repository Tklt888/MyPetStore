<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单支付 - MyPetStore</title><link rel="stylesheet" th:href="@{/css/storefront.css}"></head><body><header th:replace="~{fragments/shell :: header('orders')}"></header><main class="store-shell page"><section class="panel payment-box"><span class="eyebrow">ORDER PAYMENT</span><h1>确认支付</h1><p>核对订单金额后完成支付。当前为课程环境，不会产生真实扣款。</p><p th:text="${#strings.startsWith(order.orderNo,'DEMO-')?'MP-'+#strings.substring(order.orderNo,5):order.orderNo}"></p><div class="amount" th:text="|¥${#numbers.formatDecimal(order.totalAmount,1,2)}|">¥0.00</div><div class="actions" style="justify-content:center"><form method="post" th:action="@{/orders/{id}/payment(id=${order.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="result" value="success"><button class="primary">确认支付</button></form><form method="post" th:action="@{/orders/{id}/payment(id=${order.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="result" value="failure"><button class="danger">支付遇到问题</button></form><a class="secondary" th:href="@{/orders/{id}(id=${order.id})}">暂不支付</a></div></section></main><footer th:replace="~{fragments/shell :: footer}"></footer></body></html>
