<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${editing}?'编辑分类 - MyPetStore':'新增分类 - MyPetStore'">分类表单</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><a class="skip-link" href="#main-content">跳到主要内容</a><div class="admin-shell"><aside th:replace="~{fragments/admin-shell :: sidebar('category')}"></aside><main class="admin-main" id="main-content" tabindex="-1"><div class="content-container"><header class="page-header"><div><p class="eyebrow">CATEGORY DETAILS</p><h1 th:text="${editing}?'编辑分类':(${parentName}!=null?'新增二级分类':'新增一级分类')">分类表单</h1><p>分类编码与父分类在创建后保持不变。</p></div><a class="secondary-button" th:href="@{/admin/categories}">返回分类列表</a></header><div class="flash-message is-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">请检查表单</div>
<form method="post" th:action="${editing}?@{/admin/categories/{id}(id=${category.id})}:@{/admin/categories}"><input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-layout"><div class="form-card"><section class="form-section"><h2>分类信息</h2><div class="field"><label for="code">分类编码 <span class="required">*</span></label><input class="control" id="code" name="code" maxlength="32" required th:unless="${editing}" th:value="${form.code}"><div class="readonly-wrap" th:if="${editing}"><input class="control" id="code" th:value="${category.code}" readonly></div><small class="field-help">编码创建后不可修改</small></div><div class="field"><label>父分类</label><div class="readonly-wrap"><input class="control" th:value="${parentName}?:'无（一级分类）'" readonly></div><input th:if="${!editing and form.parentId!=null}" type="hidden" name="parentId" th:value="${form.parentId}"><small class="field-help">父分类创建后不可修改</small></div><div class="field"><label for="name">分类名称 <span class="required">*</span></label><input class="control" id="name" name="name" maxlength="50" required th:value="${form.name}"></div><div class="field"><label for="sortOrder">排序值 <span class="required">*</span></label><input class="control" id="sortOrder" name="sortOrder" type="number" min="0" required th:value="${form.sortOrder}"><small class="field-help">数值越小，显示位置越靠前</small></div><div class="form-actions"><button class="primary-save" type="submit" th:text="${editing}?'保存修改':'创建分类'">保存</button><a class="secondary-button" th:href="@{/admin/categories}">取消</a></div></section></div><aside class="form-aside"><h2>层级规则</h2><ul><li>系统只支持一级和二级分类。</li><li>一级分类下可以继续新增二级分类。</li><li>被商品使用的分类不能删除。</li></ul></aside></div></form>
</div></main></div></body></html>
