<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选购商品 - MyPetStore</title><link rel="stylesheet" th:href="@{/css/storefront.css}"><script defer th:src="@{/js/motion.js}"></script></head><body>
<header th:replace="~{fragments/shell :: header('catalog')}"></header>
<main class="store-shell page catalog-page">
    <details class="mobile-filter"><summary>筛选与分类 <span>⌄</span></summary><form method="get" th:action="@{/category}"><input type="hidden" name="sort" th:value="${sort}"><div class="field"><label for="mobileKeyword">商品名称</label><input class="control" id="mobileKeyword" name="keyword" th:value="${keyword}" placeholder="搜索商品名称"></div><div class="field"><label for="mobileCategory">商品分类</label><select class="control" id="mobileCategory" name="categoryId"><option value="">全部商品</option><option th:each="c:${categories}" th:value="${c.id}" th:selected="${c.id==categoryId}" th:text="${c.parentId==null?c.name:'　'+c.name}"></option></select></div><div class="field"><label for="mobileType">商品类型</label><select class="control" id="mobileType" name="productType"><option value="ALL" th:selected="${productType=='ALL'}">全部类型</option><option value="PETS" th:selected="${productType=='PETS'}">宠物</option><option value="SUPPLIES" th:selected="${productType=='SUPPLIES'}">宠物用品</option></select></div><button class="primary">应用筛选</button></form></details>
    <div class="catalog-shell">
        <aside class="catalog-sidebar">
            <section><h2>商品分类</h2><a class="sidebar-all" th:classappend="${categoryId==null}?' is-active'" th:href="@{/category(productType=${productType},sort=${sort})}"><span>全部商品</span><b th:text="${page.total}">0</b></a><a class="sidebar-category" th:each="c,stat:${categories}" th:if="${c.parentId==null}" th:classappend="${c.id==categoryId}?' is-active'" th:href="@{/category(categoryId=${c.id},productType=${productType},sort=${sort})}"><img th:src="${stat.index%5==0?'/images/products/K9-BGL-03/cover-light.png':(stat.index%5==1?'/images/products/CT-SIA-05/cover-light.png':(stat.index%5==2?'/images/products/AQ-CRF-12/cover-light.png':(stat.index%5==3?'/images/products/BR-CNR-08/cover-light.png':'/images/products/RP-IGU-09/cover-light.png')))}" th:alt="${c.name}"><span th:text="${c.name}">分类</span><span>›</span></a></section>
            <form class="sidebar-filter" method="get" th:action="@{/category}"><input type="hidden" name="categoryId" th:value="${categoryId}"><input type="hidden" name="sort" th:value="${sort}"><h2>筛选商品</h2><div class="field"><label for="keyword">商品名称</label><input class="control" id="keyword" name="keyword" maxlength="120" th:value="${keyword}" placeholder="输入名称关键字"></div><fieldset class="field type-filter"><legend>商品类型</legend><div class="type-toggle"><input id="productTypeAll" type="radio" name="productType" value="ALL" th:checked="${productType=='ALL'}"><label for="productTypeAll">全部类型</label><input id="productTypePets" type="radio" name="productType" value="PETS" th:checked="${productType=='PETS'}"><label for="productTypePets">宠物</label><input id="productTypeSupplies" type="radio" name="productType" value="SUPPLIES" th:checked="${productType=='SUPPLIES'}"><label for="productTypeSupplies">宠物用品</label></div></fieldset><button class="sidebar-apply">应用筛选</button><a class="sidebar-clear" th:href="@{/category}">清除筛选</a></form>
        </aside>
        <section class="catalog-content">
            <nav class="breadcrumbs"><a th:href="@{/main}">首页</a><span>›</span><a th:href="@{/category}">选购商品</a><span>›</span><strong>全部商品</strong></nav>
            <div class="catalog-toolbar"><div><span class="eyebrow">CATALOG</span><h1>全部商品</h1></div><div class="catalog-toolbar__right"><span>共找到 <b th:text="${page.total}">0</b> 件商品</span><form method="get" th:action="@{/category}"><input type="hidden" name="keyword" th:value="${keyword}"><input type="hidden" name="categoryId" th:value="${categoryId}"><input type="hidden" name="productType" th:value="${productType}"><label for="sort">排序方式</label><select class="control" id="sort" name="sort" onchange="this.form.submit()"><option value="DEFAULT" th:selected="${sort=='DEFAULT'}">默认排序</option><option value="PRICE_ASC" th:selected="${sort=='PRICE_ASC'}">价格从低到高</option><option value="PRICE_DESC" th:selected="${sort=='PRICE_DESC'}">价格从高到低</option><option value="NEWEST" th:selected="${sort=='NEWEST'}">新品优先</option></select></form></div></div>
            <div class="product-grid catalog-grid"><article class="product-card" th:each="p,stat:${page.records}" th:classappend="${p.stock==0}?' is-sold-out'"><a th:href="@{/product(id=${p.id})}"><div class="product-media"><img th:src="${#strings.startsWith(p.coverImage,'images/products/')?'/'+#strings.replace(p.coverImage,'/1.jpg','/cover-light.png'):'/'+p.coverImage}" th:alt="${p.name}" th:style="|view-transition-name:product-${p.id}|"><span class="product-type" th:classappend="${#strings.contains(p.categoryName,'宠物')}?' is-pet':' is-supply'" th:text="${#strings.contains(p.categoryName,'宠物')?'活体':'用品'}">类型</span><span class="sold-out-label" th:if="${p.stock==0}">已售罄</span><span class="low-stock-label" th:if="${p.stock>0 and p.stock<=3}" th:text="|仅剩 ${p.stock} 件|">库存紧张</span></div><div class="product-body"><small th:text="${p.sku}">SKU</small><h3 th:text="${p.name}">商品</h3><p th:text="${p.summary}"></p></div></a><div class="catalog-card-footer"><span class="price" th:text="|¥${#numbers.formatDecimal(p.price,1,2)}|">¥0.00</span><form method="post" th:action="@{/cart/items}" th:if="${p.stock>0}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="productId" th:value="${p.id}"><input type="hidden" name="quantity" value="1"><button class="card-add" title="加入购物车" aria-label="加入购物车">＋</button></form><button class="card-add" disabled th:if="${p.stock==0}" aria-label="商品已售罄">＋</button></div></article></div>
            <div class="empty panel" th:if="${page.records.isEmpty()}"><h2>未找到相关商品</h2><p>请尝试更换搜索词或清除筛选条件。</p><a class="primary" th:href="@{/category}">清除所有筛选</a></div>
            <nav class="pagination catalog-pagination" aria-label="分页"><a th:if="${page.current>1}" th:href="@{/category(page=${page.current-1},pageSize=${pageSize},keyword=${keyword},categoryId=${categoryId},productType=${productType},sort=${sort})}">‹ 上一页</a><span th:text="|第 ${page.current} / ${page.pages==0?1:page.pages} 页 · 共 ${page.total} 件|">分页</span><a th:if="${page.current<page.pages}" th:href="@{/category(page=${page.current+1},pageSize=${pageSize},keyword=${keyword},categoryId=${categoryId},productType=${productType},sort=${sort})}">下一页 ›</a></nav>
        </section>
    </div>
</main><footer th:replace="~{fragments/shell :: footer}"></footer></body></html>
