<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editing} ? '编辑分类 - MyPetStore' : '新增分类 - MyPetStore'">分类表单</title>
    <style>
        :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { margin: 0; background: #f5f7fa; color: #1f2937; }
        main { width: min(680px, calc(100% - 40px)); margin: 40px auto; }
        a { color: #2563eb; text-decoration: none; }
        .panel { margin-top: 24px; padding: 24px; background: white; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 8px 24px rgb(15 23 42 / 6%); }
        .error { padding: 12px 14px; border-radius: 8px; color: #991b1b; background: #fee2e2; }
        label { display: block; margin-top: 18px; font-weight: 600; }
        input { width: 100%; min-height: 42px; margin-top: 7px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; padding: 0 12px; font: inherit; }
        .readonly { margin: 7px 0 0; padding: 11px 12px; border-radius: 8px; background: #f3f4f6; }
        .help { color: #6b7280; font-size: 14px; }
        .actions { display: flex; align-items: center; gap: 16px; margin-top: 24px; }
        button { min-height: 42px; border: 0; border-radius: 8px; padding: 0 18px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <a th:href="@{/admin/categories}">← 返回分类列表</a>
    <section class="panel">
        <h1 th:text="${editing} ? '编辑分类' : (${parentName} != null ? '新增二级分类' : '新增一级分类')">分类表单</h1>
        <p class="error" th:if="${errorMessage}" th:text="${errorMessage}">请检查表单内容</p>

        <form method="post"
              th:action="${editing} ? @{/admin/categories/{id}(id=${category.id})} : @{/admin/categories}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div th:if="${editing}">
                <label>分类编码</label>
                <p class="readonly" th:text="${category.code}">CODE</p>
                <p class="help">编码创建后不可修改</p>
            </div>
            <div th:unless="${editing}">
                <label for="code">分类编码</label>
                <input id="code" name="code" maxlength="32" required th:value="${form.code}">
            </div>

            <label>父分类</label>
            <p class="readonly" th:text="${parentName} ?: '无（一级分类）'">无（一级分类）</p>
            <input th:if="${!editing and form.parentId != null}" type="hidden" name="parentId" th:value="${form.parentId}">

            <label for="name">分类名称</label>
            <input id="name" name="name" maxlength="50" required th:value="${form.name}">

            <label for="sortOrder">排序</label>
            <input id="sortOrder" name="sortOrder" type="number" min="0" required th:value="${form.sortOrder}">
            <p class="help">数字越小越靠前</p>

            <div class="actions">
                <button type="submit" th:text="${editing} ? '保存修改' : '创建分类'">保存</button>
                <a th:href="@{/admin/categories}">取消</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
