<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品管理 - MyPetStore</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><a class="skip-link" href="#main-content">跳到主要内容</a><div class="admin-shell"><aside th:replace="~{fragments/admin-shell :: sidebar('product')}"></aside><main class="admin-main" id="main-content" tabindex="-1"><div class="content-container">
<header class="page-header"><div><p class="eyebrow">CATALOG MANAGEMENT</p><h1>商品管理</h1><p>支持新增商品、编辑资料、上下架与库存补货。</p></div><a class="page-action" th:href="@{/admin/products/new}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新增商品</a></header>
<div class="flash-message" role="status" th:if="${message}" th:text="${message}">操作成功</div><div class="flash-message is-error" role="alert" th:if="${error}" th:text="${error}">操作失败</div>
<section class="filter-card" aria-labelledby="filter-title"><h2 id="filter-title" class="section-heading">筛选商品</h2><form class="filter-grid" method="get" th:action="@{/admin/products}">
<div class="control-group"><label for="keyword">商品名称或 SKU</label><input class="control" id="keyword" type="search" name="keyword" placeholder="输入名称或 SKU" th:value="${query.keyword}"></div>
<div class="control-group"><label for="topCategoryId">一级分类</label><select class="control" id="topCategoryId" name="topCategoryId"><option value="">全部一级分类</option><option th:each="c:${topCategoryOptions}" th:value="${c.parentId}" th:selected="${query.topCategoryId==c.parentId}" th:text="${c.parentName}"></option></select></div>
<div class="control-group"><label for="categoryId">二级分类</label><select class="control" id="categoryId" name="categoryId"><option value="">全部二级分类</option><option th:each="c:${categoryOptions}" th:value="${c.id}" th:selected="${query.categoryId==c.id}" th:text="|${c.parentName} / ${c.name}|"></option></select></div>
<div class="control-group"><label for="status">商品状态</label><select class="control" id="status" name="status"><option value="">全部状态</option><option value="ON_SALE" th:selected="${query.status=='ON_SALE'}">已上架</option><option value="DRAFT" th:selected="${query.status=='DRAFT'}">已下架</option></select></div><input th:if="${query.maxStock != null}" type="hidden" name="maxStock" th:value="${query.maxStock}"><button class="filter-submit" type="submit">查询</button><a class="secondary-button" th:href="@{/admin/products}">清空</a></form></section>
<section class="data-card" aria-label="商品列表"><div class="table-scroll"><table class="data-table"><thead><tr><th>ID</th><th>SKU</th><th>名称</th><th>分类</th><th class="numeric">价格</th><th class="numeric">库存</th><th>状态</th><th class="numeric">排序</th><th>操作</th></tr></thead><tbody>
<tr th:each="p:${page.records}" th:id="|row-products-${p.id}|"><td class="numeric" th:text="${p.id}">1</td><td class="sku" th:text="${p.sku}">DOG-001</td><td><div class="product-name" th:text="${p.name}">商品名称</div></td><td><span class="category-path" th:text="|${p.topCategoryName} / ${p.categoryName}|">一级 / 二级</span></td><td class="numeric" th:text="|¥${#numbers.formatDecimal(p.price,1,2)}|">¥0.00</td><td class="numeric" th:classappend="${p.stock==0}?' stock-zero'" th:text="${p.stock}">0</td><td><span class="status-badge" th:classappend="${p.status=='ON_SALE'}?' is-on':' is-off'" th:text="${p.status=='ON_SALE'?'已上架':'已下架'}">已上架</span></td><td class="numeric" th:text="${p.sortOrder}">0</td><td><div class="row-actions"><a th:href="@{/admin/products/{id}/edit(id=${p.id})}">编辑</a><a th:href="@{/admin/products/{id}/restock(id=${p.id})}">补货</a><form class="inline-form" method="post" th:action="@{/admin/products/{id}/status(id=${p.id})}"><input type="hidden" name="status" th:value="${p.status=='ON_SALE'?'DRAFT':'ON_SALE'}"><input type="hidden" name="version" th:value="${p.version}"><input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-action" th:classappend="${p.status=='ON_SALE'}?' is-danger'" type="submit" th:text="${p.status=='ON_SALE'?'下架':'上架'}">下架</button></form></div></td></tr>
<tr th:if="${page.records.isEmpty()}"><td class="empty-state" colspan="9"><strong>没有找到符合条件的商品</strong><p>请调整筛选条件，或<a class="text-action" th:href="@{/admin/products}">清空全部筛选</a>。</p><p th:if="${page.pages>0 and page.current>page.pages}">当前页超出范围，<a class="text-action" th:href="@{/admin/products(page=1,keyword=${query.keyword},status=${query.status},topCategoryId=${query.topCategoryId},categoryId=${query.categoryId})}">返回第一页</a> 或 <a class="text-action" th:href="@{/admin/products(page=${page.pages},keyword=${query.keyword},status=${query.status},topCategoryId=${query.topCategoryId},categoryId=${query.categoryId})}">前往最后一页</a>。</p></td></tr></tbody></table></div>
<footer class="table-footer"><span th:text="|共 ${page.total} 件商品 · 第 ${page.current} / ${page.pages==0?1:page.pages} 页|">共 0 件商品</span><nav class="pagination" aria-label="商品分页"><a th:if="${page.current>1}" th:href="@{/admin/products(page=${page.current-1},keyword=${query.keyword},status=${query.status},topCategoryId=${query.topCategoryId},categoryId=${query.categoryId},maxStock=${query.maxStock})}">上一页</a><span class="page-current" th:text="${page.current}">1</span><a th:if="${page.current<page.pages}" th:href="@{/admin/products(page=${page.current+1},keyword=${query.keyword},status=${query.status},topCategoryId=${query.topCategoryId},categoryId=${query.categoryId},maxStock=${query.maxStock})}">下一页</a></nav></footer></section>
</div></main></div></body></html>
