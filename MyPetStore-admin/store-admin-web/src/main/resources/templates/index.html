<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${applicationName}">MyPetStore 管理端</title>
</head>
<body>
<main>
    <h1 th:text="${applicationName}">MyPetStore 管理端</h1>
    <p>你好，<strong th:text="${adminDisplayName}">管理员</strong>。</p>
    <p>数据库连接成功，当前共有 <strong th:text="${productCount}">0</strong> 个商品。</p>
    <p><a th:href="@{/admin/products}">进入商品管理</a></p>
    <form method="post" th:action="@{/logout}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">安全退出</button>
    </form>
</main>
</body>
</html>
